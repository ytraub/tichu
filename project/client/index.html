<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tichu</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="screen">
        <div></div>
        <div class="game">
            <canvas id="canvas"></canvas>
            <div class="action_bar">
                <span id="lobby_buttons">
                    <button id="start_game_btn">Start Game</button>
                </span>

                <span id="playing_buttons">
                    <span>
                        <button id="play_cards_btn">Play Cards</button>
                        <button id="pass_btn">Pass</button>
                    </span>

                    <span class="sort_by">
                        <p>Sort by</p>
                        <span>
                            <button id="sort_by_value_btn">Value</button>
                            <button id="sort_by_color_btn">Color</button>
                        </span>
                    </span>
                </span>

                <span id="schupfen_buttons">
                    <span>
                        <p>Left Opponent</p>
                        <button id="start_game_btn">Choose...</button>
                    </span>
                    <span>
                        <p>Teammate</p>
                        <button id="start_game_btn">Choose...</button>
                    </span>
                    <span>
                        <p>Right Opponent</p>
                        <button id="start_game_btn">Choose...</button>
                    </span>
                </span>
            </div>
        </div>
        <div class="debug">
            <span id="teams_debug"></span>
            <span id="entity_at_move_keys_debug"></span>
        </div>
    </div>

    <script type="module" src="js/resources.js"></script>
    <script type="module" src="js/game.js"></script>
</body>

</html>
